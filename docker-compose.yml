services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      NODE_ENV: development
      PORT: "3000"
      APP_URL: http://localhost:3000
      QSTASH_TOKEN: ""
      QSTASH_EXTERNAL_QUEUE: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./.env:/app/.env:ro
      - ./storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(async r => { const j = await r.json(); process.exit(r.ok && j.checks.database ? 0 : 1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
